[project]
name = "training-service"
version = "0.4.0"
description = "House-price model training, Optuna search, MLflow logging and registry"
requires-python = ">=3.12"
dependencies = [
    "mlflow==3.1.0",
    "xgboost>=2.1",
    "optuna>=4.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "psycopg2-binary>=2.9",
    "pyarrow>=17",
]

[tool.uv]
package = false
